<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0c0a">
    <title>SPECS // Cocktail Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-shell">
        
        <!-- HEADER -->
        <header class="top-nav">
            <div class="nav-brand">
                <span class="logo">SPECS</span>
                <span class="drink-count" id="card-index-indicator">01 / 37</span>
            </div>

            <div class="nav-controls">
                <!-- Mode Toggle -->
                <div class="mode-pill">
                    <button id="btn-mode-quiz" class="mode-btn active">QUIZ</button>
                    <button id="btn-mode-study" class="mode-btn">STUDY</button>
                </div>

                <!-- Streak & Sound -->
                <div class="streak-pill" id="streak-badge" title="Current streak">
                    🔥 <span id="streak-val">0</span>
                </div>
                <button id="btn-sound" class="icon-btn" aria-label="Toggle Sound">
                    <span id="sound-icon">🔊</span>
                </button>
            </div>
        </header>

        <!-- MAIN CARD VIEW -->
        <main class="deck-container">
            <div class="card-flipper" id="card-flipper">
                
                <!-- FRONT FACE -->
                <section class="card-face card-front" id="card-front">
                    <div class="card-header">
                        <div class="meta-tags">
                            <span class="tag" id="card-category">PRE-PROHIBITION</span>
                            <span class="tag-sub" id="card-era">Circa 1880s</span>
                        </div>
                        <h1 class="drink-title" id="card-title">Old Fashioned</h1>
                        <div class="spec-badges">
                            <div class="spec-badge">
                                <span class="badge-label">GLASS</span>
                                <strong id="card-glass">Rocks</strong>
                            </div>
                            <div class="spec-badge">
                                <span class="badge-label">METHOD</span>
                                <strong id="card-method">Stirred</strong>
                            </div>
                        </div>
                    </div>

                    <!-- INGREDIENTS AREA -->
                    <div class="recipe-container">
                        <div class="section-heading">SPECIFICATION</div>
                        <ul class="recipe-list" id="recipe-list">
                            <!-- Injected via JavaScript -->
                        </ul>
                    </div>

                    <!-- FLIP HINT / TOGGLE -->
                    <button class="flip-action-bar" id="btn-flip-front">
                        <span>TAP FOR PEDIGREE & PRO-TIP</span>
                        <span class="flip-arrow">↺</span>
                    </button>
                </section>

                <!-- BACK FACE -->
                <section class="card-face card-back" id="card-back">
                    <div class="card-header back-header">
                        <div>
                            <span class="tag back-tag">MASTER DOSSIER</span>
                            <h2 class="drink-title small" id="back-title">Old Fashioned</h2>
                        </div>
                        <button class="icon-btn-text" id="btn-flip-back">
                            RETURN ✕
                        </button>
                    </div>

                    <div class="dossier-body">
                        <!-- Tasting Profile -->
                        <div class="dossier-section">
                            <div class="section-heading">TASTING PROFILE</div>
                            <div class="tasting-tags" id="back-tasting"></div>
                        </div>

                        <!-- Full Recipe with Exact Specs -->
                        <div class="dossier-section">
                            <div class="section-heading">CANONICAL MEASURES</div>
                            <div class="canonical-box" id="back-canonical"></div>
                        </div>

                        <!-- Pro Tip -->
                        <div class="dossier-section tip-box">
                            <div class="section-heading amber">BARTENDER'S PRO-TIP</div>
                            <p class="body-text" id="back-protip"></p>
                        </div>

                        <!-- Historical Lore -->
                        <div class="dossier-section">
                            <div class="section-heading">HISTORICAL ORIGIN</div>
                            <p class="body-text" id="back-history"></p>
                        </div>
                    </div>
                </section>

            </div>
        </main>

        <!-- BOTTOM INTERACTION AREA -->
        <footer class="bottom-dock">
            
            <!-- QUIZ CHOICES (Visible in Quiz Mode) -->
            <div class="quiz-tray" id="quiz-tray">
                <div class="quiz-prompt" id="quiz-prompt">Identify the missing ingredient:</div>
                <div class="choices-grid" id="choices-grid">
                    <!-- 4 Large Tappable Option Buttons -->
                </div>
            </div>

            <!-- DECK NAVIGATION -->
            <div class="nav-bar">
                <button class="nav-btn" id="btn-prev" aria-label="Previous Drink">
                    <span class="nav-icon">‹</span> PREV
                </button>

                <button class="nav-btn center-action" id="btn-search-modal">
                    ALL SPECIMENS ☰
                </button>

                <button class="nav-btn" id="btn-next" aria-label="Next Drink">
                    NEXT <span class="nav-icon">›</span>
                </button>
            </div>
        </footer>

        <!-- QUICK JUMP MODAL -->
        <div class="modal-overlay" id="search-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>SELECT DRINK (37)</h3>
                    <button class="icon-btn" id="btn-close-modal">✕</button>
                </div>
                <div class="modal-list" id="modal-drinks-list">
                    <!-- 37 items injected via JS -->
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
